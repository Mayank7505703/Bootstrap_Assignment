<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notifications Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card p-4">
      <h4 class="mb-4">User Notifications</h4>

      <div class="alert alert-success">✔ New Message Received!</div>
      <div class="alert alert-info">💡 Tip: Update your profile today!</div>
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        ⚠ Warning: Password expires soon!
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>

      <div class="bg-light border rounded p-3 mt-3">
        <h6>Summary</h6>
        <p>You have 3 notifications pending review.</p>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
