<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">
  <div class="container text-center p-5">
    <h1 class="fw-bold">John Doe</h1>
    <p class="lead mb-3">Web Developer & Designer</p>
    <img src="https://via.placeholder.com/150" class="img-fluid rounded-circle mb-4" alt="Profile">
    <div class="mb-4">
      <button class="btn btn-primary me-2">Hire Me</button>
      <button class="btn btn-outline-secondary">Download CV</button>
    </div>
    <form class="mx-auto" style="max-width: 400px;">
      <input type="text" class="form-control mb-2" placeholder="Your Name">
      <input type="email" class="form-control mb-2" placeholder="Your Email">
      <textarea class="form-control mb-2" placeholder="Message"></textarea>
      <button class="btn btn-success w-100">Send</button>
    </form>
  </div>
</body>
</html>
