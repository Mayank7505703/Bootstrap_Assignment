<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Agency Showcase</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active" data-bs-interval="2000">
          <img src="https://via.placeholder.com/800x300?text=Paris" class="d-block w-100" alt="">
          <div class="carousel-caption"><h5>Paris, France</h5></div>
        </div>
        <div class="carousel-item" data-bs-interval="2000">
          <img src="https://via.placeholder.com/800x300?text=Bali" class="d-block w-100" alt="">
          <div class="carousel-caption"><h5>Bali, Indonesia</h5></div>
        </div>
        <div class="carousel-item" data-bs-interval="2000">
          <img src="https://via.placeholder.com/800x300?text=New+York" class="d-block w-100" alt="">
          <div class="carousel-caption"><h5>New York, USA</h5></div>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>

    <div class="progress mt-4" style="height:25px;">
      <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width:70%">70% Booked</div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3">
    <p>Contact us: info@travelagency.com | +1 234 567 890</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
