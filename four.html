<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Today's Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container text-center py-5">
    <h1 class="fw-bold">Today's Menu</h1>
    <p class="lead mb-4">Fresh and Delicious Meals</p>

    <table class="table table-striped">
      <thead><tr><th>Item</th><th>Category</th><th>Price</th></tr></thead>
      <tbody>
        <tr><td>Margherita Pizza</td><td>Main Course</td><td>$12</td></tr>
        <tr><td>Caesar Salad</td><td>Starter</td><td>$8</td></tr>
        <tr><td>Tiramisu</td><td>Dessert</td><td>$6</td></tr>
      </tbody>
    </table>

    <div class="my-4">
      <h4>Chef’s Specials</h4>
      <ul class="list-group">
        <li class="list-group-item">Lobster Risotto</li>
        <li class="list-group-item">Truffle Pasta</li>
      </ul>
    </div>

    <img src="https://via.placeholder.com/400x200" class="img-fluid mt-4" alt="Dish">
    <p class="mt-2 lead">Our signature dish of the day</p>
  </div>
</body>
</html>
